<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Tipologías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'xanaes': {
                            'dark': '#1a202c',
                            'gray': '#4a5568',
                            'light': '#e2e8f0',
                            'accent': '#2d3748'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <div class="flex h-screen bg-gray-100">
        <div class="hidden md:flex flex-col w-64 bg-xanaes-dark">
            <div class="flex items-center justify-center h-16 bg-xanaes-accent">
                <span class="text-white text-lg font-bold">VIVIENDAS XANAES</span>
            </div>
            <div class="flex flex-col flex-1 overflow-y-auto">
                <nav class="flex-1 px-2 py-4 bg-xanaes-dark">
                    <a href="dashboard-resumen.html" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-tachometer-alt mr-3"></i> Resumen
                    </a>
                    <a href="dashboard-tipologias.html" class="flex items-center px-4 py-2 bg-xanaes-accent text-white">
                        <i class="fas fa-home mr-3"></i> Tipologías
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-building mr-3"></i> Proyectos
                    </a>
                    <a href="dahsboard-leads.html" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-envelope-open-text mr-3"></i> Leads Recibidos
                    </a>
                </nav>
            </div>
        </div>

        <div class="flex flex-col flex-1 overflow-y-auto">
            <div class="flex items-center justify-between h-16 bg-white border-b border-gray-200 px-8">
                <h1 class="text-2xl font-bold text-xanaes-dark">Crear/Editar Tipología</h1>
                <a href="dashboard-tipologias.html" class="text-xanaes-gray hover:text-xanaes-dark">
                    <i class="fas fa-arrow-left mr-2"></i> Volver al listado
                </a>
            </div>

            <div class="p-8">
                <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200">
                    <form action="#" method="POST" class="space-y-6">
                        <div>
                            <label for="tipo-nombre" class="block text-sm font-medium text-xanaes-gray">Nombre de la Tipología (Ej: Tipología S)</label>
                            <input type="text" id="tipo-nombre" value="Tipología S" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-xanaes-dark focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        
                        <div>
                            <label for="tipo-slug" class="block text-sm font-medium text-xanaes-gray">URL (Slug) (Ej: tipologia-s)</label>
                            <input type="text" id="tipo-slug" value="tipologia-s" class="mt-1 block w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md text-xanaes-gray" readonly>
                            <p class="text-xs text-gray-500 mt-1">Se genera automáticamente a partir del nombre.</p>
                        </div>

                        <div>
                            <label for="tipo-resumen" class="block text-sm font-medium text-xanaes-gray">Resumen (Ej: 32 m² - 1 Dormitorio)</label>
                            <input type="text" id="tipo-resumen" value="32 m² - 1 Dormitorio" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-xanaes-dark focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        </div>

                        <div>
                            <label for="tipo-desc" class="block text-sm font-medium text-xanaes-gray">Descripción Completa</label>
                            <textarea id="tipo-desc" rows="4" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-xanaes-dark focus:outline-none focus:ring-blue-500 focus:border-blue-500">Descripción detallada del modelo. Lorem ipsum dolor sit amet...</textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-xanaes-gray">Imagen Principal</label>
                            <div class="mt-1 flex items-center p-4 border border-gray-300 rounded-md">
                                <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Tipología S" class="w-16 h-10 object-cover rounded mr-4">
                                <button type="button" class="px-3 py-2 bg-blue-100 text-blue-700 text-sm font-medium rounded-md hover:bg-blue-200">Cambiar Imagen</button>
                            </div>
                        </div>

                        <div class="flex justify-end pt-4 border-t border-gray-200">
                            <a href="dashboard-tipologias.html" class="bg-gray-200 hover:bg-gray-300 text-xanaes-dark font-bold py-2 px-4 rounded mr-3">
                                Cancelar
                            </a>
                            <a href="dashboard-tipologias.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                                Guardar Cambios
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
