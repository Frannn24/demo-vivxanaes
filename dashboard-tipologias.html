<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipologías - Dashboard Xanaes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'xanaes': {
                            'dark': '#1a202c',
                            'gray': '#4a5568',
                            'light': '#e2e8f0',
                            'accent': '#2d3748'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100">

    <div class="flex h-screen bg-gray-100">
        <div class="hidden md:flex flex-col w-64 bg-xanaes-dark">
            <div class="flex items-center justify-center h-16 bg-xanaes-accent">
                <span class="text-white text-lg font-bold">VIVIENDAS XANAES</span>
            </div>
            <div class="flex flex-col flex-1 overflow-y-auto">
                <nav class="flex-1 px-2 py-4 bg-xanaes-dark">
                    <a href="dashboard-resumen.html" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-tachometer-alt mr-3"></i> Resumen
                    </a>
                    <a href="dashboard-tipologias.html" class="flex items-center px-4 py-2 bg-xanaes-accent text-white">
                        <i class="fas fa-home mr-3"></i> Tipologías
                    </a>
                    <a href="#" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-building mr-3"></i> Proyectos
                    </a>
                    <a href="dahsboard-leads.html" class="flex items-center px-4 py-2 text-gray-400 hover:bg-xanaes-accent hover:text-white">
                        <i class="fas fa-envelope-open-text mr-3"></i> Leads Recibidos
                    </a>
                </nav>
            </div>
        </div>

        <div class="flex flex-col flex-1 overflow-y-auto">
            <div class="flex items-center justify-between h-16 bg-white border-b border-gray-200 px-8">
                <h1 class="text-2xl font-bold text-xanaes-dark">Gestión de Tipologías</h1>
                <a href="dashboard-tipologias-form.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    <i class="fas fa-plus mr-2"></i> Crear Nueva Tipología
                </a>
            </div>

            <div class="p-8">
                <p class="mb-6 text-xanaes-gray">
                    Aquí puedes crear, editar y eliminar las tipologías de viviendas que se muestran en el sitio web.
                </p>

                <div class="bg-white rounded-lg shadow-md overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-left text-sm font-semibold text-xanaes-gray">Imagen</th>
                                <th class="p-4 text-left text-sm font-semibold text-xanaes-gray">Nombre</th>
                                <th class="p-4 text-left text-sm font-semibold text-xanaes-gray">Detalle Breve</th>
                                <th class="p-4 text-left text-sm font-semibold text-xanaes-gray">m²</th>
                                <th class="p-4 text-left text-sm font-semibold text-xanaes-gray">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr class="hover:bg-gray-50">
                                <td class="p-4">
                                    <img src="https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Tipología S" class="w-16 h-10 object-cover rounded">
                                </td>
                                <td class="p-4 text-sm text-xanaes-dark font-medium">Tipología S</td>
                                <td class="p-4 text-sm text-xanaes-gray">1 Dormitorio</td>
                                <td class="p-4 text-sm text-xanaes-gray">32 m²</td>
                                <td class="p-4 text-sm text-xanaes-gray space-x-2">
                                    <a href="dashboard-tipologias-form.html" class="text-blue-600 hover:text-blue-800" title="Editar">
                                        <i class="fas fa-pencil-alt"></i>
                                    </a>
                                    <button class="text-red-600 hover:text-red-800" title="Eliminar">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
